<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF7EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tony老師">
<meta name="description" content="Tony the Teacher — 獨立設計師的預約小幫手">
<title>Tony老師</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<script src="qr.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7EE;--ink:#1B1B1F;--muted:#6E6A66;--card:#FFFFFF;--soft:#F1E7DC;--line:#E3D8CC;--dash:#CFC6BC;--red:#B42318;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
.num{font-family:Outfit,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
input,select,textarea{width:100%;background:var(--card);border:2px solid transparent;border-radius:18px;padding:12px 16px;outline:none;min-height:52px}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:#8A837D}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(120px + env(safe-area-inset-bottom))}
.hd{display:flex;align-items:center;gap:6px;margin:4px 0 14px}
.hd h1{font-size:23px;font-weight:900;margin:0 2px;position:relative;white-space:nowrap;overflow:hidden;border-radius:14px;padding:4px 8px;display:flex;align-items:center;gap:4px}
.hd h1 .caret{font-size:14px;color:var(--muted)}
.hd h1 input{position:absolute;left:0;top:0;width:100%;height:100%;max-width:100%;min-width:0;opacity:0;min-height:0;padding:0;margin:0;border:0;-webkit-appearance:none;appearance:none}
.hd .ib{position:relative;z-index:2}
.ib{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:var(--soft);flex:none;font-size:20px}
.clock{margin-left:auto;font-weight:700;color:var(--muted);font-size:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;background:var(--soft);font-weight:700;font-size:14px;min-height:40px}
h2.sec{font-size:15px;font-weight:900;margin:22px 6px 8px}
.now{border-radius:32px;padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--c)}
.now.late{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--ink)}
.now .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:13px;font-weight:900;padding:4px 12px;border-radius:999px;background:var(--ink);color:#fff;display:inline-flex;gap:6px;align-items:center;align-self:flex-start}
.now .svc{font-size:34px;font-weight:900;line-height:1.15;display:block;width:100%}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.62)}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.5);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:5px}
.big{min-height:66px;border-radius:22px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;font-weight:900;width:100%;padding:0 14px;line-height:1.25}
.big.light{background:#fff;color:var(--ink);flex-direction:column;gap:0}
.big.light small{font-size:12px;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{min-height:64px;border-radius:20px;background:var(--card);padding:8px 14px 8px 8px;display:flex;align-items:center;gap:12px;width:100%}
.row .t{width:64px;height:48px;border-radius:14px;background:var(--c);display:grid;place-items:center;font-weight:800;flex:none;font-size:16px}
.row .m{flex:1;min-width:0;display:flex;flex-direction:column}
.row .m b{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:13px;color:var(--muted);text-align:right;flex:none}
.row.req{background:transparent;border:2px dashed var(--ink)}
.row.past{opacity:.6}
.row .st{font-size:12px;font-weight:900}
.gap{min-height:52px;border:2px dashed var(--dash);border-radius:20px;padding:0 14px;display:flex;align-items:center;gap:12px;color:var(--muted);width:100%}
.gap .num{width:56px;font-weight:700}.gap .g{flex:1;font-weight:700;font-size:14px}.gap .p{font-size:26px;color:var(--ink);line-height:1}
.banner{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:20px;background:var(--ink);color:#fff;font-weight:900;margin-bottom:12px}
.banner.soft{background:var(--soft);color:var(--ink)}
.banner b{background:#fff;color:var(--ink);border-radius:999px;padding:0 10px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
.link{color:var(--muted);font-weight:700;font-size:14px;padding:12px 6px;display:block}
.sum{font-size:13px;color:var(--muted);margin:14px 6px 0;font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,247,238,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{max-width:520px;margin:0 auto;height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;padding:0 24px}
nav.tabs .tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);width:72px;height:64px}
nav.tabs .tb.on{color:var(--ink)}
nav.tabs .plus{width:64px;height:64px;border-radius:22px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(27,27,31,.22)}
.layer{position:fixed;inset:0;z-index:40;display:none}.layer.open{display:block}
#alert-root{z-index:60}#confirm-root{z-index:70}
.ask-m{font-size:18px;font-weight:900;line-height:1.5;margin:18px 6px 18px;white-space:pre-line}
body.desk #confirm-root .sheet{max-width:420px}
.bg{position:absolute;inset:0;background:rgba(40,30,22,.55);animation:fd .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:94vh;max-height:94dvh;background:var(--bg);border-radius:32px 32px 0 0;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{display:flex;justify-content:center;padding:12px 0 0}.grab span{width:40px;height:5px;border-radius:3px;background:var(--dash)}
.sheet .x{position:absolute;right:14px;top:14px;z-index:2}
.sbody{overflow:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sbody h1{font-size:28px;font-weight:900;margin:14px 56px 14px 6px}
@keyframes up{from{transform:translateY(60px);opacity:.3}}@keyframes fd{from{opacity:0}}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{height:92px;border-radius:22px;background:var(--c);padding:12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile b{font-size:18px;font-weight:900;line-height:1.2;word-break:break-all}.tile small{font-size:12px;font-weight:700}
.tile.k1{height:104px;padding:10px 12px;align-items:flex-start}
.tile .k1c{font-size:46px;font-weight:900;line-height:1;letter-spacing:-1px}
.tile .k1n{font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.on{box-shadow:inset 0 0 0 5px var(--ink)}
.tile.k1.on{padding:12px 14px}
.ftitle{min-height:44px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.ftitle .ch{display:inline-block;font-size:38px;font-weight:900;line-height:1.15;color:var(--c);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.ftitle .plus{display:inline-block;font-size:28px;font-weight:900;color:var(--ink);margin:0 4px}
.ftitle .new{animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
.ftitle .swap{animation:fadein .22s ease-out}
@keyframes pop{0%{transform:scale(.3) translateY(8px);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:44px;padding:0 16px;border-radius:22px;background:var(--soft);font-weight:700;font-size:15px;display:inline-flex;align-items:center;position:relative}
.chip.on{background:var(--ink);color:#fff}
.chip input{position:absolute;inset:0;opacity:0;min-height:0;padding:0}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{height:54px;border-radius:18px;background:var(--card);font-size:18px;font-weight:700;display:grid;place-items:center;position:relative}
.slot.on{background:var(--ink);color:#fff}
.slot input{position:absolute;inset:0;opacity:0;min-height:0;padding:0}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 6px 10px}.lbl h2{font-size:18px;font-weight:900;margin:0}.lbl span{font-size:13px;color:var(--muted);text-align:right}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.field>span{font-size:14px;font-weight:700;color:var(--muted);margin-left:6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sugg{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}.sugg button{padding:10px 14px;border-radius:14px;background:var(--soft);font-size:14px;text-align:left}
details.more{margin:4px 0 12px}details.more summary{list-style:none;color:var(--muted);font-weight:700;padding:10px 6px;cursor:pointer}details.more summary::-webkit-details-marker{display:none}
.head-card{border-radius:28px;background:var(--c);padding:20px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.head-card .svc{font-size:30px;font-weight:900;line-height:1.15}
.kv{background:var(--card);border-radius:20px;padding:4px 16px;margin:0 0 12px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--soft)}.kv div:last-child{border:0}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:700}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.acts.c2{grid-template-columns:1fr 1fr}.acts.c1{grid-template-columns:1fr}
.btn{min-height:54px;border-radius:18px;background:var(--card);font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit;padding:0 12px;text-align:center;line-height:1.25}
.btn.ink{background:var(--ink);color:#fff}.btn.ghost{background:transparent;color:var(--muted)}.btn.red{color:var(--red)}
.btn small{display:block;font-size:12px;font-weight:700;opacity:.75}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:22px;padding:4px;margin-bottom:16px}
.seg button{height:44px;border-radius:18px;font-weight:700;color:var(--muted);text-align:center}.seg button.on{background:var(--ink);color:#fff}
.total{border-radius:30px;background:var(--ink);color:#fff;padding:22px;display:flex;flex-direction:column;gap:4px}
.total .v{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1.05}.total small{color:#D9D3CC;font-size:14px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:3px;margin-top:14px}.stack i{background:var(--c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stile{border-radius:24px;background:var(--c);padding:16px;display:flex;flex-direction:column}.stile b{font-size:24px;font-weight:800}.stile span{font-size:13px;font-weight:700}
.list{background:var(--card);border-radius:22px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--soft);width:100%;min-height:56px}.li:last-child{border:0}
.li .g{flex:1;min-width:0}.li small{display:block;color:var(--muted);font-size:13px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none}
.handle{width:48px;height:48px;margin-right:-8px;display:grid;place-items:center;color:#9A928A;touch-action:none;cursor:grab;flex:none;-webkit-user-select:none;user-select:none}
.svc-row{background:var(--card);position:relative}
.svc-row.dragging{z-index:5;box-shadow:0 10px 26px rgba(27,27,31,.18);border-radius:16px;transition:none!important}
.svc-row.dragging .handle{color:var(--ink);cursor:grabbing}
.tog{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;min-height:0;padding:0;border:0;transition:.2s;cursor:pointer}
.tog:checked{background:var(--ink)}.tog::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tog:checked::after{left:24px}
.hrs .li{flex-wrap:wrap;gap:8px}.hrs .wd{width:40px;font-weight:900;flex:none}
.hrs .tm{display:flex;align-items:center;gap:6px;flex:1 1 190px;min-width:0}
.hrs input[type=time]{width:auto;flex:1;min-width:0;min-height:40px;padding:6px 8px;border-radius:12px;background:var(--soft);font-size:14px}
h3{font-size:14px;font-weight:900;margin:22px 6px 8px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:8px 6px;line-height:1.6}
.colors{display:flex;gap:10px;flex-wrap:wrap}.colors button{width:40px;height:40px;border-radius:50%;background:var(--c)}.colors button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.mv{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:80;white-space:nowrap}
#toast.show{opacity:1}
.hidden{display:none!important}
.login{max-width:360px;margin:14vh auto 0;display:flex;flex-direction:column;gap:12px}
.err{color:var(--red);font-size:14px;min-height:20px}
.qrbox{display:flex;justify-content:center;margin:6px 0 4px}
/* ---------- 桌面版（電腦、iPad）：左側選單＋預約行事曆 ---------- */
body.desk #app{max-width:none;padding:0}
body.desk nav.tabs{display:none!important}
body.desk #toast{bottom:32px}
body.desk .layer.open{display:flex;align-items:center;justify-content:center;padding:24px}
body.desk .sheet{position:relative;left:auto;right:auto;bottom:auto;width:100%;max-width:560px;max-height:100%;border-radius:28px}
body.desk .grab{display:none}
body.desk .sbody{padding:14px 20px 24px}
.dk{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.dk-side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px 24px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line);background:#FBF1E5}
.dk-brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;padding:0 4px;min-width:0}
.dk-brand b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-side .big{min-height:52px;font-size:17px;border-radius:18px;flex:none}
.dk-nav{display:flex;flex-direction:column;gap:2px}
.dk-nav button{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:14px;font-weight:700;color:var(--muted)}
.dk-nav button:hover{background:var(--soft);color:var(--ink)}
.dk-nav button.on{background:var(--ink);color:#fff}
.dk-side h3{margin:6px 4px -4px}
.dk-side .row{min-height:54px;padding:6px 10px 6px 6px;gap:8px}.dk-side .row .t{width:52px;height:40px;font-size:14px}.dk-side .row .m b{font-size:15px}.dk-side .row .r{font-size:12px}
.dk-now{border-radius:22px;background:var(--c);padding:14px;display:flex;flex-direction:column;gap:8px;flex:none}
.dk-now.late{box-shadow:0 0 0 3px #FBF1E5,0 0 0 5px var(--ink)}
.dk-now .svc{font-size:20px;font-weight:900;line-height:1.2;text-align:left}
.dk-now .two .btn{min-height:44px;font-size:15px}
.dk-now .btn:not(.ink){background:#fff}
.mini{background:var(--card);border-radius:20px;padding:10px 8px;flex:none}
.mini-hd{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:14px;margin:0 2px 4px}
.mini-hd button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.mini-hd button:hover{background:var(--soft)}
.mini-r{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center;justify-items:center;height:46px;border-radius:14px;border:1.5px solid transparent;margin-top:2px}
.mini-r.wk{background:var(--soft);border-color:var(--dash)}
.mini-r.wd{height:22px;margin:0}
.mini-r.wd span{font-size:11px;color:var(--muted);font-weight:700}
.md{width:30px;height:38px;padding:7px 0 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700;line-height:1.1;position:relative;font-variant-numeric:tabular-nums}
button.md:hover{background:rgba(27,27,31,.08)}
.md.off{color:#B5ADA5}
.md.hol{color:var(--red)}
.md.vis{box-shadow:inset 0 0 0 1.5px var(--ink)}
.md.td,.md.td:hover{background:var(--ink);color:#fff}
.md.dot::after{content:"";position:absolute;left:50%;bottom:7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ink)}
.md.td.dot::after{background:#fff}
.cal-dh.hol small,.cal-dh.hol:not(.today) b{color:var(--red)}
.cal-dh.today.hol small{color:#FFA394}
.dk-main{min-width:0;padding:0 24px 40px}
.dk-page{max-width:760px;margin:0 auto;padding-top:20px}
.dk-top{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:16px}
.dk-top .banner{margin-bottom:10px}
.dk-bar{margin:0 0 8px}
.dk-bar .pill{margin-left:auto}
.dk-bar .clock{margin-left:4px;min-width:52px;text-align:right}
.dk-seg{display:flex;background:var(--soft);border-radius:16px;padding:3px;gap:2px}
.dk-seg button{height:38px;padding:0 14px;border-radius:13px;font-weight:700;color:var(--muted)}
.dk-seg button.on{background:var(--ink);color:#fff}
.cal-head,.cal-body{display:grid;grid-template-columns:56px repeat(var(--cols),minmax(0,1fr))}
.cal-head{padding-bottom:6px}
.cal-dh{padding:5px 2px 7px;margin:0 3px;border-radius:14px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0}
.cal-dh:hover{background:var(--soft)}
.cal-dh small{font-size:12px;color:var(--muted);font-weight:700}
.cal-dh b{font-size:21px;font-weight:800;width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.cal-dh.today,.cal-dh.today:hover{background:var(--ink);color:#fff}.cal-dh.today small,.cal-dh.today em{color:rgba(255,255,255,.75)}
.cal-dh em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:700;min-height:15px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-body{background:var(--card);border-radius:20px;overflow:hidden}
.cal-times{position:relative}
.cal-times span{position:absolute;right:8px;margin-top:3px;font-size:12px;color:var(--muted);font-weight:700}
.cal-col{position:relative;border-left:1px solid var(--soft);cursor:pointer;background-image:repeating-linear-gradient(to bottom,var(--soft) 0 1px,transparent 1px var(--hh))}
.cal-col:hover{background-color:#FFFBF6}
.cal-off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(227,216,204,.45) 0 6px,rgba(241,231,220,.25) 6px 12px);pointer-events:none;display:grid;place-items:center;color:var(--muted);font-weight:900;font-size:14px}

<script type="module">
/* ============================================================
   雲端設定來源（優先順序）：
   1. config.js 的 window.TONY_CONFIG.firebase
   2. 在 APP「管理 → 設定 → 雲端同步」貼上的設定（存在這支手機）
   都沒有 = 單機版（資料只存在這支手機）
   ============================================================ */
const LS_FB = 'tony-firebase-config', LS_LOCAL = 'salon-app-v1';
const SDK = (window.TONY_CONFIG && window.TONY_CONFIG.sdkBase) || 'https://www.gstatic.com/firebasejs/10.12.2/';
const LS_EMAIL = 'tony-login-email';
const unb64url = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
// 「在電腦／iPad 上使用」連結：網址 #setup=雲端設定&e=Email，打開後自動存好，只剩輸入密碼
(() => {
  const h = new URLSearchParams(location.hash.slice(1)), s = h.get('setup'), e = h.get('e');
  if (!s && !e) return;
  try { if (s) { const o = JSON.parse(unb64url(s)); if (o.apiKey && o.projectId) localStorage.setItem(LS_FB, JSON.stringify(o)); } } catch {}
  try { if (e) localStorage.setItem(LS_EMAIL, e); } catch {}
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
})();
function readConfig() {
  const c = window.TONY_CONFIG && window.TONY_CONFIG.firebase;
  if (c && c.apiKey && c.projectId) return [c, 'file'];
  try { const s = JSON.parse(localStorage.getItem(LS_FB)); if (s && s.apiKey && s.projectId) return [s, 'local']; } catch {}
  return [null, ''];
}
const [FIREBASE_CONFIG, CFG_SRC] = readConfig();
const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const SITE = 'https://justin121710.github.io/tony-the-teacher/';
function bookLink() {
  // 在預覽視窗或直接開檔案時，網址不是一般網址，改用正式網站的預約頁
  let base = SITE + 'book.html';
  try { if (/^https?:$/.test(location.protocol)) base = new URL('book.html', location.href).href.split(/[?#]/)[0]; } catch {}
  if (CFG_SRC === 'local' && FIREBASE_CONFIG) { const { apiKey, authDomain, projectId, appId } = FIREBASE_CONFIG; base += '#c=' + b64url(JSON.stringify({ apiKey, authDomain, projectId, appId })); }
  return base;
}
function cardLink() {
  let base = SITE + 'card.html';
  try { if (/^https?:$/.test(location.protocol)) base = new URL('card.html', location.href).href.split(/[?#]/)[0]; } catch {}
  const st = S.settings || {};
  const q = new URLSearchParams({ u: bookLink(), n: st.shopName || '', p: st.shopPhone || '', l: st.shopLine || '' });
  return base + '#' + q.toString();
}
function deviceLink() {
  let base = SITE;
  try { if (/^https?:$/.test(location.protocol)) base = location.href.split(/[?#]/)[0]; } catch {}
  const p = new URLSearchParams();
  if (CFG_SRC === 'local' && FIREBASE_CONFIG) { const { apiKey, authDomain, projectId, appId } = FIREBASE_CONFIG; p.set('setup', b64url(JSON.stringify({ apiKey, authDomain, projectId, appId }))); }
  const em = backend.email ? backend.email() : ''; if (em) p.set('e', em);
  return base + (p.toString() ? '#' + p : '');
}
function parseConfig(text) {
  let t = String(text || '').trim();
  const lk = t.match(/[#&]setup=([\w-]+)/);   // 也可以直接貼「在電腦上使用」的連結
  if (lk) t = unb64url(lk[1]);
  const i = t.indexOf('{'), j = t.lastIndexOf('}');
  if (i < 0 || j < i) throw new Error('找不到設定內容');
  t = t.slice(i, j + 1).replace(/\/\/.*$/gm, '').replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
  const o = JSON.parse(t);
  if (!o.apiKey || !o.projectId) throw new Error('缺少 apiKey 或 projectId');
  return o;
}
const BOT_EMAIL = 'notify-bot@tony-teacher.app';
function rulesText(email) {
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isOwner() {
      return request.auth != null && request.auth.token.email == '${email}';
    }
    // 通知機器人：只能讀取，用來發 LINE／Email 通知
    function isBot() {
      return request.auth != null && request.auth.token.email == '${BOT_EMAIL}';
    }
    match /public/{doc} { allow read: if true; allow write: if isOwner(); }
    match /busy/{date} { allow read: if true; allow write: if isOwner(); }
    match /holds/{id} {
      allow read: if true;
      allow create: if request.resource.data.keys().hasOnly(['date','s','e','createdAt'])
        && request.resource.data.date is string && request.resource.data.date.size() == 10
        && request.resource.data.s is int && request.resource.data.e is int
        && request.resource.data.e > request.resource.data.s && request.resource.data.e - request.resource.data.s <= 720
        && request.resource.data.createdAt is int;
      allow delete: if isOwner();
    }
    match /requests/{id} {
      allow create: if request.resource.data.keys().hasOnly(['date','start','duration','price','services','name','phone','note','status','createdAt','holdId','editKey','editOf','prevText'])
        && (!('editKey' in request.resource.data) || (request.resource.data.editKey is string && request.resource.data.editKey.size() >= 16 && request.resource.data.editKey.size() <= 64))
        && (!('editOf' in request.resource.data) || (request.resource.data.editOf is string && request.resource.data.editOf.size() <= 64))
        && (!('prevText' in request.resource.data) || (request.resource.data.prevText is string && request.resource.data.prevText.size() <= 80))
        && request.resource.data.status == 'pending'
        && request.resource.data.date is string && request.resource.data.date.size() == 10
        && request.resource.data.start is string && request.resource.data.start.size() == 5
        && request.resource.data.duration is int && request.resource.data.duration > 0 && request.resource.data.duration <= 720
        && request.resource.data.price is number
        && request.resource.data.services is list && request.resource.data.services.size() <= 10
        && request.resource.data.name is string && request.resource.data.name.size() <= 30
        && request.resource.data.phone is string && request.resource.data.phone.size() >= 8 && request.resource.data.phone.size() <= 15
        && request.resource.data.note is string && request.resource.data.note.size() <= 200
        && request.resource.data.createdAt is int;
      allow read, update, delete: if isOwner();
    }
    match /{coll}/{id} {
      allow read, write: if isOwner();
      allow read: if isBot() && coll in ['settings', 'bookings', 'requests'];
    }
  }
}`;
}

/* ---------- 工具 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toMin = hm => { const [h, m] = String(hm).split(':').map(Number); return h * 60 + m; };
const toHM = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDs = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseDs(s); d.setDate(d.getDate() + n); return ds(d); };
const today = () => ds(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const WD = '日一二三四五六';
const money = n => '$' + Math.round(Number(n) || 0).toLocaleString('zh-TW');
const hmm = m => Math.floor(m / 60) + ':' + pad(m % 60);
const durText = m => m >= 60 ? Math.floor(m / 60) + ' 小時' + (m % 60 ? ' ' + (m % 60) + ' 分' : '') : m + ' 分';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byStart = (a, b) => (a.date || '').localeCompare(b.date || '') || toMin(a.start) - toMin(b.start);
const dateLabel = s => { const d = parseDs(s); return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const dayWord = s => s === today() ? '今天' : s === addDays(today(), 1) ? '明天' : dateLabel(s);
const PALETTE = ['#FF8A65', '#6EC6FF', '#B79CFF', '#FFD54A', '#63D9B5', '#F49AC1', '#A3D977', '#D7C3A8'];
const STATUS = { booked: '已預約', done: '已完成', noshow: '未到', cancelled: '已取消' };
const ICON = {
  check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  bell: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15zM10 20.5a2 2 0 004 0"/></svg>',
  x: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  prev: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  next: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
};
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function upsert(arr, obj) { const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); }
const clean = o => JSON.parse(JSON.stringify(o));

/* ---------- 預設資料 ---------- */
const DEFAULT_SETTINGS = {
  shopName: '我的髮型工作室', weekStart: 0, slotStep: 30, bookAheadDays: 30, holidays: [], alerts: true, keepAwake: true,
  hours: {
    0: { open: true, start: '10:00', end: '19:00' }, 1: { open: false, start: '10:00', end: '20:00' },
    2: { open: true, start: '10:00', end: '20:00' }, 3: { open: true, start: '10:00', end: '20:00' },
    4: { open: true, start: '10:00', end: '20:00' }, 5: { open: true, start: '10:00', end: '20:00' },
    6: { open: true, start: '10:00', end: '19:00' } }
};
// 髮長：短髮不加；中長以上依服務設定加時加價（服務的 len 為空 = 不分髮長）
const HAIR = [['s', '短髮', '耳上'], ['m', '中長', '到肩'], ['l', '長髮', '過肩'], ['x', '超長', '胸下']];
const hairName = k => (HAIR.find(h => h[0] === k) || [])[1] || '';
const LEN_DEFAULT = { m: { d: 15, p: 200 }, l: { d: 30, p: 400 }, x: { d: 60, p: 800 } };
const lenAdd = (s, hl) => (s.len && s.len[hl]) || { d: 0, p: 0 };
const svcSnap = (s, hl) => ({ id: s.id, name: s.name, duration: s.duration, price: s.price, color: s.color || '', ...(s.len ? { hl: hl || 's' } : {}) });
const svcLabel = s => s.name + (s.hl ? '（' + hairName(s.hl) + '）' : '');
const hairOf = list => (list || []).find(s => s.hl)?.hl || '';
const DEFAULT_SERVICES = [['剪髮', 60, 500], ['洗髮', 30, 300], ['燙髮', 150, 2500, true], ['染髮', 120, 2000, true], ['護髮', 45, 800, true]];
const defaultServices = () => DEFAULT_SERVICES.map(([name, duration, price, len], i) => ({ id: 's' + (i + 1), name, duration, price, color: PALETTE[i], active: true, order: i, ...(len ? { len: clean(LEN_DEFAULT) } : {}) }));

/* ---------- 狀態 ---------- */
const S = { settings: null, services: [], customers: [], bookings: [], requests: [] };
const U = { tab: 'day', more: 'income', date: today(), q: '', month: today().slice(0, 7), showEnded: false };
try { if (sessionStorage.getItem('tony-return') === 'set') { U.tab = 'more'; U.more = 'set'; sessionStorage.removeItem('tony-return'); } } catch {}
let backend;

const services = () => [...S.services].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const activeServices = () => services().filter(s => s.active !== false);
const svcNames = b => (b.services || []).map(svcLabel).join('＋') || '預約';
const colorOf = b => { const s = b.services?.[0]; return (s && (S.services.find(x => x.id === s.id)?.color || s.color)) || PALETTE[7]; };
const who = b => b.customerName || (b.phone ? '尾號 ' + b.phone.replace(/\D/g, '').slice(-3) : '');
const endOf = b => toMin(b.start) + b.duration;

function dayHours(date) {
  if (!S.settings || (S.settings.holidays || []).includes(date)) return null;
  const h = S.settings.hours?.[parseDs(date).getDay()];
  return h && h.open ? [toMin(h.start), toMin(h.end)] : null;
}
function busyRanges(date, excludeId) {
  const r = S.bookings.filter(b => b.date === date && b.status === 'booked' && b.id !== excludeId).map(b => [toMin(b.start), endOf(b)]);
  S.requests.filter(q => q.date === date && q.id !== excludeId).forEach(q => r.push([toMin(q.start), toMin(q.start) + q.duration]));
  return r;
}
const overlaps = (s, e, ranges) => ranges.some(([a, b]) => s < b && e > a);
function freeStarts(date, dur, excludeId) {
  const h = dayHours(date); if (!h || !dur) return [];
  const busy = busyRanges(date, excludeId), step = S.settings.slotStep || 30, out = [];
  const t = date === today() ? nowMin() : (date < today() ? Infinity : -1);
  for (let s = h[0]; s + dur <= h[1]; s += step) { if (s <= t) continue; if (overlaps(s, s + dur, busy)) continue; out.push(s); }
  return out;
}
function ensureCustomer(name, phone, cid, hl) {
  if (!name && !phone && !cid) return null;
  let c = (cid && S.customers.find(x => x.id === cid)) || (phone && S.customers.find(x => x.phone === phone)) || (!phone && name && S.customers.find(x => x.name === name));
  const hair = hl ? { hairLen: hl } : {};
  if (!c) { c = { id: uid(), name: name || '', phone: phone || '', note: '', ...hair, createdAt: Date.now() }; backend.put('customers', c); }
  else if ((name && c.name !== name) || (phone && c.phone !== phone) || (hl && c.hairLen !== hl)) { c = { ...c, name: name || c.name, phone: phone || c.phone, ...hair }; backend.put('customers', c); }
  return c;
}
const todayBooked = () => S.bookings.filter(b => b.date === today() && b.status === 'booked').sort(byStart);
const current = () => todayBooked().find(b => toMin(b.start) <= nowMin()) || null;   // 最早一筆「已開始但尚未完成」
const nextUp = () => todayBooked().find(b => toMin(b.start) > nowMin()) || null;

/* ---------- 單機版儲存 ---------- */
function localBackend() {
  const KEY = 'salon-app-v1';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ settings: S.settings, services: S.services, customers: S.customers, bookings: S.bookings })); } catch (e) { toast('無法儲存：' + e.message); } };
  return {
    mode: 'local',
    async start() {
      let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch {}
      if (d && d.settings) { Object.assign(S, d); S.settings = { ...clean(DEFAULT_SETTINGS), ...d.settings }; }
      else { S.settings = clean(DEFAULT_SETTINGS); S.services = defaultServices(); save(); }
      S.requests = [];
      try { navigator.storage?.persist?.(); } catch {}
      showShell(); render(); keepAwake();
    },
    put(coll, obj) { upsert(S[coll], obj); save(); render(); },
    remove(coll, id) { S[coll] = S[coll].filter(x => x.id !== id); save(); render(); },
    saveSettings(s) { S.settings = s; save(); render(); },
    replaceAll(d) { S.settings = { ...clean(DEFAULT_SETTINGS), ...d.settings }; S.services = d.services || []; S.customers = d.customers || []; S.bookings = d.bookings || []; save(); render(); }
  };
}

/* ---------- 雲端版（Firebase） ---------- */
const SINCE = (() => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 12); return ds(d); })();   // 雲端只同步近 12 個月
async function cloudBackend() {
  const [{ initializeApp }, A, F] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]);
  const app = initializeApp(FIREBASE_CONFIG), auth = A.getAuth(app), db = F.getFirestore(app);
  let unsubs = [], pubT, deniedShown = false;
  const fail = e => {
    if (e && e.code === 'permission-denied') { if (!deniedShown) { deniedShown = true; showRulesHelp(true); } return; }
    toast('同步失敗：' + (e.code || e.message));
  };
  const syncBusy = date => { if (date) F.setDoc(F.doc(db, 'busy', date), { ranges: busyRanges(date).map(([s, e]) => ({ s, e })) }).catch(fail); };
  const syncPublic = () => { clearTimeout(pubT); pubT = setTimeout(() => {
    if (!S.settings) return; const st = S.settings;
    F.setDoc(F.doc(db, 'public', 'info'), clean({ shopName: st.shopName, shopPhone: st.shopPhone || '', shopLine: st.shopLine || '', shopAddress: st.shopAddress || '', notifyUrl: st.notifyUrl || '',
      slotStep: st.slotStep, bookAheadDays: st.bookAheadDays, holidays: st.holidays, hours: st.hours,
      services: activeServices().map(s => ({ id: s.id, name: s.name, duration: s.duration, price: s.price, color: s.color || '', ...(s.len ? { len: s.len } : {}) })) })).catch(fail);
    // 通知網址另外存一份：舊版 APP 改寫 public/info 時不會把它洗掉
    F.setDoc(F.doc(db, 'public', 'notify'), { url: (st.notifyUrl || '').trim() }).catch(fail);
  }, 800); };
  const after = (coll, dates) => { if (coll === 'bookings' || coll === 'requests') new Set(dates.filter(Boolean)).forEach(syncBusy); if (coll === 'services') syncPublic(); };
  async function seed() {
    const b = F.writeBatch(db);
    b.set(F.doc(db, 'settings', 'main'), clean(DEFAULT_SETTINGS));
    defaultServices().forEach(({ id, ...s }) => b.set(F.doc(db, 'services', id), s));
    await b.commit();
  }
  async function cleanHolds() {
    try {
      const [hs, rs] = await Promise.all([F.getDocs(F.collection(db, 'holds')), F.getDocs(F.collection(db, 'requests'))]);
      const used = new Set(rs.docs.map(d => d.data().holdId).filter(Boolean)), cut = Date.now() - 10 * 60000;
      hs.docs.forEach(d => { const h = d.data(); if (h.date < today() || (!used.has(d.id) && (h.createdAt || 0) < cut)) F.deleteDoc(d.ref).catch(() => {}); });
    } catch {}
  }
  function offerMigrate() {
    let d = null; try { d = JSON.parse(localStorage.getItem(LS_LOCAL)); } catch {}
    if (!d || !(d.bookings || []).length || localStorage.getItem('tony-migrated') || S.bookings.length) return;
    localStorage.setItem('tony-migrated', '1');
    ask(`這支手機有單機版的 ${d.bookings.length} 筆預約、${(d.customers || []).length} 位客人，要上傳到雲端嗎？`, '上傳').then(ok => {
      if (ok) this.replaceAll(d).then(() => toast('上傳完成'), fail);
    });
  }
  function subscribe() {
    let seeded = false, first = true, bkInit = false;
    unsubs.push(F.onSnapshot(F.doc(db, 'settings', 'main'), snap => {
      if (!snap.exists()) { if (!seeded) { seeded = true; seed().catch(fail); } return; }
      S.settings = { ...clean(DEFAULT_SETTINGS), ...snap.data() }; render();
      if (first) { first = false; setTimeout(syncPublic, 1500); keepAwake(); cleanHolds(); setInterval(cleanHolds, 30 * 60000); }
    }, fail));
    for (const c of ['services', 'customers', 'bookings']) unsubs.push(F.onSnapshot(c === 'bookings' ? F.query(F.collection(db, c), F.where('date', '>=', SINCE)) : F.collection(db, c), snap => {
      S[c] = snap.docs.map(d => ({ ...d.data(), id: d.id })); render();
      if (c === 'bookings' && !bkInit) { bkInit = true; setTimeout(() => offerMigrate.call(api), 1200); }
    }, fail));
    let reqInit = false;
    unsubs.push(F.onSnapshot(F.collection(db, 'requests'), snap => {
      const addedDocs = snap.docChanges().filter(ch => ch.type === 'added').map(ch => ch.doc.data());
      S.requests = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      // 客人修改了「還沒確認」的申請：新的取代舊的，舊的自動移除
      supersededRequests().forEach(p => api.remove('requests', p.id));
      if (reqInit && addedDocs.length) {
        const ed = addedDocs.some(d => d.editOf);
        toast(ed ? '客人修改了預約' : '有新的線上預約'); chime(); sysNotify(ed ? '客人修改了預約' : '新的線上預約', '打開 Tony老師 確認');
      }
      reqInit = true;
      const dates = new Set(snap.docChanges().map(ch => ch.doc.data().date)); render(); dates.forEach(syncBusy);
    }, fail));
  }
  const api = {
    mode: 'cloud',
    email: () => auth.currentUser?.email || '',
    start() {
      A.onAuthStateChanged(auth, u => {
        unsubs.forEach(f => f()); unsubs = [];
        if (!u) { S.settings = null; showLogin(); return; }
        showShell(); render(); subscribe();
      });
    },
    async allBookings() { const snap = await F.getDocs(F.collection(db, 'bookings')); return snap.docs.map(d => ({ ...d.data(), id: d.id })); },
    async idToken() { return auth.currentUser ? auth.currentUser.getIdToken() : ''; },
    async login(email, pw) { await A.signInWithEmailAndPassword(auth, email, pw); },
    async resetPw(email) { await A.sendPasswordResetEmail(auth, email); },
    logout() { A.signOut(auth); },
    put(coll, obj) {
      const prev = S[coll].find(x => x.id === obj.id); upsert(S[coll], obj); render();
      const { id, ...data } = obj; F.setDoc(F.doc(db, coll, id), clean(data)).catch(fail);
      after(coll, [obj.date, prev?.date]);
    },
    remove(coll, id) {
      const prev = S[coll].find(x => x.id === id); S[coll] = S[coll].filter(x => x.id !== id); render();
      F.deleteDoc(F.doc(db, coll, id)).catch(fail);
      if (coll === 'requests' && prev?.holdId) F.deleteDoc(F.doc(db, 'holds', prev.holdId)).catch(() => {});
      after(coll, [prev?.date]);
    },
    saveSettings(s) { S.settings = s; render(); F.setDoc(F.doc(db, 'settings', 'main'), clean(s)).catch(fail); syncPublic(); },
    async replaceAll(d) {
      const items = [['settings', { id: 'main', ...d.settings }], ...['services', 'customers', 'bookings'].flatMap(c => (d[c] || []).map(x => [c, x]))];
      for (let i = 0; i < items.length; i += 400) {
        const b = F.writeBatch(db);
        items.slice(i, i + 400).forEach(([c, { id, ...x }]) => b.set(F.doc(db, c, id), clean(x)));
        await b.commit();
      }
      new Set((d.bookings || []).map(b => b.date).filter(x => x >= today())).forEach(syncBusy); syncPublic();
    }
  };
  return api;
}

/* ---------- 聲音、震動、螢幕常亮 ---------- */
let actx = null, audioOK = false, wake = null, bell = null, bellUnlocking = false, wantRing = false;
// 預先產生一段提示音（WAV），用一般的 <audio> 播放：iPhone 開靜音鍵時 Web Audio 會被靜音，<audio> 搭配 playback 模式比較可靠
function chimeWavUrl() {
  const sr = 22050, len = Math.floor(sr * 1.9), data = new Int16Array(len);
  [[0, 880], [0.22, 1175], [0.44, 1568], [0.9, 880], [1.12, 1175], [1.34, 1568]].forEach(([t0, f]) => {
    const st = Math.floor(t0 * sr), n = Math.floor(0.42 * sr);
    for (let i = 0; i < n && st + i < len; i++) {
      const t = i / sr, env = Math.min(1, t / 0.01) * Math.exp(-t * 9);
      data[st + i] = Math.max(-32767, Math.min(32767, data[st + i] + Math.sin(2 * Math.PI * f * t) * env * 0.55 * 32767));
    }
  });
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, len * 2, true);
  new Int16Array(buf, 44).set(data);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function markAudioOK() { if (!audioOK) { audioOK = true; const el = document.querySelector('.banner.soft[data-act="unlock"]'); if (el) setTimeout(() => el.remove(), 0); } }
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  try {
    if (!bell) { bell = new Audio(chimeWavUrl()); bell.preload = 'auto'; bell.setAttribute('playsinline', ''); }
    if (!audioOK && !bellUnlocking) {
      bellUnlocking = true; bell.muted = true;
      const p = bell.play();
      const done = ok => { bellUnlocking = false; if (!wantRing) { bell.pause(); bell.currentTime = 0; } bell.muted = false; if (ok) markAudioOK(); };
      if (p && p.then) p.then(() => done(true), () => done(false)); else done(true);
    }
  } catch {}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(); g.gain.value = 0; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.02);
    if (actx.state === 'running') markAudioOK();
  } catch {}
}
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('touchend', unlockAudio, true);
function beepWebAudio() {
  if (!actx) return;
  try {
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + 0.05;
    [[0, 880], [0.22, 1175], [0.44, 1568], [0.9, 880], [1.12, 1175], [1.34, 1568]].forEach(([dt, f]) => {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(0.6, t0 + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.35);
      o.connect(g).connect(actx.destination); o.start(t0 + dt); o.stop(t0 + dt + 0.4);
    });
  } catch {}
}
function chime() {
  try { navigator.vibrate?.([300, 120, 300, 120, 300]); } catch {}
  if (!bell) { beepWebAudio(); return; }
  try {
    wantRing = true; bell.muted = false; bell.volume = 1; bell.currentTime = 0;
    const p = bell.play();
    const end = () => { wantRing = false; };
    bell.onended = end;
    if (p && p.catch) p.catch(() => { end(); beepWebAudio(); });
  } catch { wantRing = false; beepWebAudio(); }
}
async function keepAwake() {
  if (!S.settings?.keepAwake || !('wakeLock' in navigator) || document.hidden) return;
  try { if (!wake || wake.released) wake = await navigator.wakeLock.request('screen'); } catch {}
}
function sysNotify(title, body) {
  try { if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification(title, { body, tag: 'salon-late', renotify: true }); } catch {}
}

function viewDay() {
  const d = U.date, isT = d === today(), dt = parseDs(d), n = nowMin(), step = S.settings.slotStep || 30;
  let h = `<div class="hd"><button class="ib" data-act="day" data-n="-1" aria-label="前一天">${ICON.prev}</button>
    <h1>${isT ? '今天' : '週' + WD[dt.getDay()]} <span class="num">${dt.getMonth() + 1}/${dt.getDate()}</span><span class="caret" aria-hidden="true">▾</span><input type="date" data-chg="jump" value="${d}" aria-label="選擇日期"></h1>
    <button class="ib" data-act="day" data-n="1" aria-label="後一天">${ICON.next}</button>
    ${isT ? `<span class="clock num" id="clock">${toHM(n)}</span>` : '<button class="pill" data-act="today" style="margin-left:auto">回今天</button>'}</div>`;
  if (S.settings.alerts !== false && !audioOK) h += `<button class="banner soft" data-act="unlock"><span>點一下，開啟超時提醒聲音</span>${ICON.bell}</button>`;
  if (S.requests.length) h += `<button class="banner" data-act="reqs"><span>${S.requests.some(q => q.editOf) ? '線上預約／修改待確認' : '線上預約待確認'}</span><b class="num">${S.requests.length}</b></button>`;
  const all = S.bookings.filter(b => b.date === d);
  const booked = all.filter(b => b.status === 'booked').sort(byStart);
  const ended = all.filter(b => b.status !== 'booked').sort(byStart);
  const reqs = S.requests.filter(q => q.date === d);
  const hrs = dayHours(d);
  let card = null, mode = '';
  if (isT) { const c = current(); if (c) { card = c; mode = n >= endOf(c) ? 'late' : 'cur'; } else { const nx = nextUp(); if (nx) { card = nx; mode = 'next'; } } }
  if (!hrs) h += '<div class="empty" style="padding-bottom:6px">這天是公休日</div>';
  if (card) h += nowCard(card, mode);
  const items = [
    ...booked.filter(b => b !== card).map(b => ({ s: toMin(b.start), html: rowHtml(b, isT && endOf(b) <= n) })),
    ...reqs.map(q => ({ s: toMin(q.start), html: reqRow(q) }))];
  const floor = d < today() ? Infinity : isT ? Math.ceil((n + 1) / step) * step : -Infinity;
  if (hrs && floor !== Infinity) {
    const blocks = [...booked, ...reqs].map(x => [toMin(x.start), toMin(x.start) + x.duration]).sort((a, b) => a[0] - b[0]);
    let cur = Math.max(hrs[0], floor);
    for (const [s, e] of blocks) { if (s - cur >= step) items.push({ s: cur, html: gapHtml(cur, s) }); cur = Math.max(cur, e); }
    if (hrs[1] - cur >= step) items.push({ s: cur, html: gapHtml(cur, hrs[1]) });
  }
  items.sort((a, b) => a.s - b.s);
  if (items.length) h += `<h2 class="sec">${card ? '接下來' : '預約'}</h2><div class="rows">${items.map(x => x.html).join('')}</div>`;
  else if (!card) h += hrs ? `<div class="empty">${floor === Infinity ? '這天沒有預約' : '今天已經沒有空檔了'}</div>` : `<button class="gap" data-act="new"><span class="num"></span><span class="g">仍要新增預約</span><span class="p">+</span></button>`;
  if (!hrs && items.length) h += `<button class="gap" data-act="new" style="margin-top:8px"><span class="num"></span><span class="g">仍要新增預約</span><span class="p">+</span></button>`;
  const live = all.filter(b => b.status === 'booked' || b.status === 'done');
  if (live.length) h += `<div class="sum">${live.length} 組・預估 ${money(live.reduce((a, b) => a + (b.price || 0), 0))}</div>`;
  if (ended.length) {
    h += `<button class="link" data-act="ended">${U.showEnded ? '收起' : '查看'}已結束（${ended.length}）</button>`;
    if (U.showEnded) h += `<div class="rows">${ended.map(b => rowHtml(b, true)).join('')}</div>`;
  }
  return h;
}
function nowCard(b, mode) {

  const tags = [who(b), b.note].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  return `<div class="now ${mode === 'late' ? 'late' : ''}" style="--c:${colorOf(b)}">

    <button class="svc" data-act="bk" data-id="${b.id}">${esc(svcNames(b))}</button>
    ${tags ? `<div class="tags">${tags}</div>` : ''}
    ${mode === 'cur' ? `<div class="bar"><i style="width:${Math.min(100, Math.max(3, (n - s) / (e - s) * 100))}%"></i></div><span style="font-size:13px;font-weight:700;margin-top:-6px">還剩 ${durText(e - n)}</span>` : ''}
    ${mode === 'late' ? `<div class="two"><button class="big light" data-act="shift" data-id="${b.id}">後面順延<small>${planShift(b, 15).moves.length ? '會影響後面的預約' : '後面沒有預約'}</small></button><button class="big" data-act="done" data-id="${b.id}">${ICON.check}做完了</button></div>`
      : mode === 'cur' ? `<button class="big" data-act="done" data-id="${b.id}">${ICON.check}做完了・${money(b.price)}</button>` : ''}
  </div>`;
}
function rowHtml(b, past) {
  const st = b.status !== 'booked' ? `<span class="st">${STATUS[b.status]}</span>` : past ? '<span class="st">未按完成</span>' : '';

/* ---------- 面板 ---------- */
function openLayer(rootSel, body, acts = {}, mount, opts = {}) {
  const root = $(rootSel);
  root.innerHTML = `<div class="bg"></div><div class="sheet" role="${opts.alert ? 'alertdialog' : 'dialog'}">${opts.alert ? '' : `<button class="ib x" aria-label="關閉">${ICON.x}</button>`}<div class="grab"><span></span></div><div class="sbody">${body}</div></div>`;
  root.classList.add('open'); document.body.style.overflow = 'hidden';
  if (!opts.alert) { root.querySelector('.bg').onclick = () => closeLayer(rootSel); root.querySelector('.x').onclick = () => closeLayer(rootSel); }
  root.querySelector('.sbody').onclick = e => { const t = e.target.closest('[data-s]'); if (t && acts[t.dataset.s]) acts[t.dataset.s](t, e); };
  mount && mount(root.querySelector('.sheet'));
}
function closeLayer(rootSel) {
  const r = $(rootSel); r.classList.remove('open'); r.innerHTML = '';
  if (!$('#sheet-root').classList.contains('open') && !$('#alert-root').classList.contains('open')) document.body.style.overflow = '';
  if (rootSel === '#sheet-root') render();
}
const openSheet = (b, a, m) => openLayer('#sheet-root', b, a, m);
const closeSheet = () => closeLayer('#sheet-root');

/* ---------- 順延 ---------- */
function planShift(b, d) {
  const started = b.date === today() && toMin(b.start) <= nowMin();
  const moves = []; let cursor;
  if (started) cursor = endOf(b) + d;
  else { moves.push({ b, from: b.start, to: toHM(toMin(b.start) + d) }); cursor = endOf(b) + d; }
  S.bookings.filter(x => x.date === b.date && x.status === 'booked' && x.id !== b.id && toMin(x.start) >= toMin(b.start)).sort(byStart).forEach(x => {
    const s = toMin(x.start);
    if (s < cursor) { moves.push({ b: x, from: x.start, to: toHM(cursor) }); cursor += x.duration; } else cursor = Math.max(cursor, s + x.duration);
  });
  return { started, moves, lastEnd: cursor };
}
function applyShift(b, d, plan) {
  if (plan.started) backend.put('bookings', { ...b, duration: b.duration + d, extra: (b.extra || 0) + d });
  plan.moves.forEach(m => { const x = S.bookings.find(y => y.id === m.b.id) || m.b; backend.put('bookings', { ...x, start: m.to, origStart: x.origStart || m.from }); });
}
function shiftUI(b, opts = {}) {
  let d = 0;
  const late = nowMin() - endOf(b);
  const body = `${opts.alert ? `<div class="head-card" style="--c:${colorOf(b)}"><span class="badge">${ICON.clock}時間到了</span><span class="svc">${esc(svcNames(b))}</span>
      <span style="font-weight:700">預計 ${toHM(endOf(b))} 結束${late > 0 ? `・已超過 ${late} 分` : ''}${who(b) ? '・' + esc(who(b)) : ''}</span></div>`
      : `<h1>順延多久？</h1>`}
    <div class="lbl"><h2>${opts.alert ? '還要多久？' : (planShift(b, 0).started ? '這位還要多做' : '這位與後面延後')}</h2><span>後面的預約會自動往後排</span></div>
    <div class="slots" id="sh-opts">${[10, 15, 20, 30].map(m => `<button class="slot num" data-s="pick" data-m="${m}">+${m}</button>`).join('')}</div>
    <div class="f2" style="margin-top:8px"><input id="sh-custom" type="number" inputmode="numeric" min="1" max="240" placeholder="其他分鐘數" aria-label="其他分鐘數"><button class="btn" data-s="custom">確定</button></div>
    <div id="sh-prev"></div>
    ${opts.alert ? `<div class="two" style="margin-top:6px"><button class="btn ghost" data-s="snooze">忽略<small>5 分鐘後再提醒</small></button><button class="btn ink" data-s="done">${ICON.check}已經做完了</button></div>` : ''}`;
  const acts = {
    pick(t) { d = +t.dataset.m; $('#sh-custom').value = ''; preview(); },
    custom() { const v = +$('#sh-custom').value; if (!(v > 0 && v <= 240)) return toast('請輸入 1–240 分鐘'); d = v; preview(); },
    apply(t) {
      const plan = planShift(b, d); applyShift(b, d, plan);
      const notify = t.dataset.n === '1' && plan.moves.some(m => m.b.phone);
      finish(); toast(`已順延 ${d} 分鐘`);
      if (notify) openNotify(plan.moves.filter(m => m.b.phone));
    },
    snooze() { snooze[b.id] = Date.now() + 5 * 60000; finish(); toast('5 分鐘後會再提醒'); },
    done() { backend.put('bookings', { ...b, status: 'done', doneAt: Date.now() }); finish(); toast('已完成'); }
  };
  const finish = () => opts.alert ? closeAlert() : closeSheet();
  function preview() {
    document.querySelectorAll('#sh-opts .slot').forEach(s => s.classList.toggle('on', +s.dataset.m === d));
    const plan = planShift(b, d), hrs = dayHours(b.date), withPhone = plan.moves.filter(m => m.b.phone).length;
    $('#sh-prev').innerHTML = `<div class="lbl"><h2>會變成這樣</h2><span>+${d} 分</span></div>
      ${plan.moves.length ? `<div class="mv">${plan.moves.map(m => `<div class="row" style="--c:${colorOf(m.b)}"><span class="t num">${m.to}</span><span class="m"><b>${esc(svcNames(m.b))}</b><small>原本 ${m.from}${who(m.b) ? '・' + esc(who(m.b)) : ''}${m.b.phone ? '・有電話' : '・沒有電話'}</small></span></div>`).join('')}</div>`
        : `<p class="note">${plan.started ? `這位延長到 ${toHM(endOf(b) + d)}，` : ''}後面沒有預約受影響。</p>`}
      ${hrs && plan.lastEnd > hrs[1] ? `<p class="note" style="color:var(--red)">最後會做到 ${toHM(plan.lastEnd)}，超過營業時間。</p>` : ''}
      ${withPhone ? `<button class="big" data-s="apply" data-n="1">順延並通知 ${withPhone} 組客人</button><button class="btn ghost" data-s="apply" data-n="0" style="width:100%">只順延，不通知</button>`
        : `<button class="big" data-s="apply" data-n="0">確定順延 ${d} 分鐘</button>`}`;
  }
  if (opts.alert) openLayer('#alert-root', body, acts, null, { alert: true }); else openSheet(body, acts);
}
function openNotify(moves) {
  const shop = S.settings.shopName;
  openSheet(`<h1>通知客人</h1><p class="note">逐一點「傳簡訊」，訊息已經寫好。</p>
    <div class="mv">${moves.map(m => { const tel = m.b.phone.replace(/[^\d+]/g, ''); const msg = `您好，設計師目前進度稍有延誤，您原本 ${m.from} 的預約將延後至 ${m.to} 開始，造成不便敬請見諒。\n\n${bookingInfo(m.b, m.to)}\n\n— ${shop}`;
      return `<div class="row" style="--c:${colorOf(m.b)}"><span class="t num">${m.to}</span><span class="m"><b>${esc(svcNames(m.b))}</b><small>${esc(who(m.b))}</small></span><a class="btn ink" style="min-height:44px" href="sms:${tel}?&body=${encodeURIComponent(msg)}">傳簡訊</a></div>`; }).join('')}</div>
    <button class="btn" data-s="close" style="width:100%">完成</button>`, { close: closeSheet });

/* ---------- 超時提醒 ---------- */
const snooze = {};
let alertFor = null, ringT = null;
function checkAlert() {
  if (!S.settings || S.settings.alerts === false || alertFor) return;
  const c = current(); if (!c || nowMin() < endOf(c)) return;
  if (snooze[c.id] && Date.now() < snooze[c.id]) return;
  alertFor = c.id; shiftUI(c, { alert: true });
  let n = 0; chime(); clearInterval(ringT);
  ringT = setInterval(() => { n++; if (n < 10 || n % 8 === 0) chime(); }, 4000);
  sysNotify('時間到了：' + svcNames(c), `預計 ${toHM(endOf(c))} 結束，要順延後面的預約嗎？`);
}
function closeAlert() { alertFor = null; clearInterval(ringT); closeLayer('#alert-root'); render(); }
let lastMin = -1;
function tick() {
  if (!S.settings) return;
  const n = nowMin();
  if (alertFor) { const b = S.bookings.find(x => x.id === alertFor); if (!b || b.status !== 'booked' || n < endOf(b)) closeAlert(); }
  if (n !== lastMin) {
    lastMin = n;
    if (U.tab === 'day' && !sheetOpen() && !alertFor && !document.activeElement?.matches('input,select,textarea')) render();
  }
  checkAlert();
}
setInterval(tick, 10000);

  const f = { id: ex?.id, date: ex?.date || init.date || U.date, start: ex ? toMin(ex.start) : (init.start ?? null),

    dur: ex?.duration ?? 0, price: ex?.price ?? 0, durT: !!ex, priceT: !!ex,
    hl: hairOf(ex?.services) || init.hairLen || S.customers.find(c => c.id === (ex?.customerId || init.customerId))?.hairLen || 's' };
  if (f.date < today() && !ex) f.date = today();
  let shown = null;
  const tiles = [...activeServices(), ...f.svc.map(lookup).filter(s => s && !activeServices().some(a => a.id === s.id))];
  const body = `<h1 class="ftitle" id="f-title">${ex ? '編輯預約' : '做什麼？'}</h1>
    <div class="tiles" id="f-svc">${tiles.map(s => `<button class="tile k1" data-s="svc" data-id="${s.id}" style="--c:${s.color || PALETTE[7]}" aria-label="${esc(s.name)}"><span class="k1c">${esc([...s.name][0] || '')}</span><span class="k1n">${esc(s.name)}・${hmm(s.duration)}</span></button>`).join('')}</div>
    <div id="f-lenbox" hidden><div class="lbl"><h2>頭髮多長？</h2></div><div class="chips" id="f-len"></div></div>
    <div class="lbl"><h2>什麼時候？</h2><span id="f-sum"></span></div>
    <div class="chips" id="f-days"></div>
    <div class="slots" id="f-slots" style="margin-top:10px"></div>
    <p class="note" id="f-hint"></p>
    <div class="f2" style="margin-top:10px"><input id="f-phone" type="tel" inputmode="tel" placeholder="電話（選填）" autocomplete="off" aria-label="電話"><input id="f-name" placeholder="稱呼（選填）" autocomplete="off" aria-label="稱呼"></div>
    <div class="sugg" id="f-sugg"></div>
    <details class="more" ${ex ? 'open' : ''}><summary>＋ 備註、金額、時長</summary>
      <div class="field"><span>備註</span><input id="f-note" placeholder="例如：長髮、指定藥水"></div>
      <div class="f2"><label class="field"><span>金額</span><input id="f-price" type="number" inputmode="numeric" min="0" step="10"></label><label class="field"><span>時長（分）</span><input id="f-dur" type="number" inputmode="numeric" min="5" step="5"></label></div>
    </details>
    <button class="big" data-s="save" id="f-save">建立預約</button>`;
  const acts = {
    svc(t) { const id = t.dataset.id; f.svc = f.svc.includes(id) ? f.svc.filter(x => x !== id) : [...f.svc, id]; recalc(); },
    len(t) { setHair(t.dataset.k); },
    day(t) { f.date = t.dataset.d; f.start = null; slots(); },
    slot(t) { f.start = +t.dataset.m; slots(); },
    pick(t) { const c = S.customers.find(x => x.id === t.dataset.id); f.customerId = c.id; $('#f-name').value = c.name || ''; $('#f-phone').value = c.phone || ''; $('#f-sugg').innerHTML = ''; if (c.hairLen) setHair(c.hairLen); },
    save
  };
  openSheet(body, acts, sh => {
    $('#f-name', sh).value = ex?.customerName || init.name || '';
    $('#f-phone', sh).value = ex?.phone || init.phone || '';
    $('#f-note', sh).value = ex?.note || '';
    $('#f-dur', sh).oninput = e => { f.durT = true; f.dur = +e.target.value || 0; slots(); };
    $('#f-price', sh).oninput = e => { f.priceT = true; f.price = +e.target.value || 0; };
    const sugg = e => {
      f.customerId = null; const q = e.target.value.trim().toLowerCase();
      const m = q.length >= 2 ? S.customers.filter(c => (c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q)).slice(0, 3) : [];
      $('#f-sugg').innerHTML = m.map(c => `<button data-s="pick" data-id="${c.id}">${esc(c.name || '')} <span style="color:var(--muted)">${esc(c.phone || '')}</span></button>`).join('');
    };
    $('#f-name', sh).oninput = sugg; $('#f-phone', sh).oninput = sugg;
    recalc();
  });
  function title(chosen) {
    const el = $('#f-title'); if (!el) return;
    const ids = chosen.map(s => s.id), prev = shown;
    shown = ids;
    if (!ids.length) {
      if (ex) return;
      el.innerHTML = `<span${prev && prev.length ? ' class="swap"' : ''} style="display:inline-block">做什麼？</span>`; return;
    }
    el.innerHTML = chosen.map((s, i) => (i ? '<span class="plus">+</span>' : '') +
      `<span class="ch${!prev || !prev.includes(s.id) || !prev.length ? ' new' : ''}" style="--c:${s.color || PALETTE[7]}">${esc([...s.name][0] || '')}</span>`).join('');
    el.setAttribute('aria-label', chosen.map(s => s.name).join('＋'));
  }
  // 換髮長：手動改過的時長、金額也跟著加減差額
  function setHair(k) {
    const chosen = f.svc.map(lookup).filter(Boolean), add = hl => chosen.reduce((a, s) => ({ d: a.d + lenAdd(s, hl).d, p: a.p + lenAdd(s, hl).p }), { d: 0, p: 0 });
    const was = add(f.hl), now = add(k);
    if (f.durT) f.dur = Math.max(5, f.dur + now.d - was.d);
    if (f.priceT) f.price = Math.max(0, f.price + now.p - was.p);
    f.hl = k; recalc();
  }
  function recalc() {
    const chosen = f.svc.map(lookup).filter(Boolean);
    if (!f.durT) f.dur = chosen.reduce((a, s) => a + s.duration + lenAdd(s, f.hl).d, 0);
    if (!f.priceT) f.price = chosen.reduce((a, s) => a + s.price + lenAdd(s, f.hl).p, 0);
    $('#f-dur').value = f.dur || ''; $('#f-price').value = f.price || '';
    $('#f-lenbox').hidden = !chosen.some(s => s.len);
    $('#f-len').innerHTML = HAIR.map(([k, n, h]) => `<button class="chip ${k === f.hl ? 'on' : ''}" data-s="len" data-k="${k}">${n}<small style="font-weight:500;margin-left:5px;opacity:.7">${h}</small></button>`).join('');
    document.querySelectorAll('#f-svc .tile').forEach(c => c.classList.toggle('on', f.svc.includes(c.dataset.id)));
    title(chosen);
    slots();
  }
  function slots() {
    const t = today(), quick = [t, addDays(t, 1), addDays(t, 2)];
    const other = !quick.includes(f.date);
    $('#f-days').innerHTML = quick.map((d, i) => `<button class="chip ${d === f.date ? 'on' : ''}" data-s="day" data-d="${d}">${['今天', '明天', '後天'][i]}${dayHours(d) ? '' : '（休）'}</button>`).join('')
      + `<label class="chip ${other ? 'on' : ''}">${other ? dateLabel(f.date) : '其他日期'}<input type="date" id="f-date" value="${f.date}" aria-label="其他日期"></label>`;
    $('#f-date').onchange = e => { if (e.target.value) { f.date = e.target.value; f.start = null; slots(); } };
    const list = freeStarts(f.date, f.dur, f.id);
    const custom = f.start != null && !list.includes(f.start);
    $('#f-slots').innerHTML = !f.dur ? '<p class="note" style="grid-column:1/-1;margin:0">先選服務，就會列出空檔</p>'
      : list.map(m => `<button class="slot num ${m === f.start ? 'on' : ''}" data-s="slot" data-m="${m}">${toHM(m)}</button>`).join('')
        + `<label class="slot ${custom ? 'on num' : ''}">${custom ? toHM(f.start) : '自訂'}<input type="time" id="f-time" step="300" value="${f.start != null ? toHM(f.start) : ''}" aria-label="自訂時間"></label>`;
    const ti = $('#f-time'); if (ti) ti.onchange = e => { if (e.target.value) { f.start = toMin(e.target.value); slots(); } };
    $('#f-hint').textContent = !dayHours(f.date) ? '這天公休，可用「自訂」時間。' : f.dur && !list.length ? '這天已經沒有空檔，可用「自訂」時間。' : '';
    $('#f-sum').textContent = f.dur ? `${durText(f.dur)}・${money(f.price)}` : '';
    $('#f-save').textContent = f.start != null ? `${ex ? '儲存' : '建立'}・${dayWord(f.date)} ${toHM(f.start)}` : (ex ? '儲存變更' : '建立預約');
  }
  async function save() {
    const name = $('#f-name').value.trim(), phone = $('#f-phone').value.trim(), note = $('#f-note').value.trim();
    if (!f.dur || f.dur <= 0) return toast('請選擇服務');
    if (f.start == null) return toast('請選擇時間');
    const h = dayHours(f.date);
    if (overlaps(f.start, f.start + f.dur, busyRanges(f.date, f.id)) && !(await ask('這個時段和其他預約重疊，仍要儲存嗎？', '仍要儲存'))) return;
    if ((!h || f.start < h[0] || f.start + f.dur > h[1]) && !(await ask('不在營業時間內，仍要儲存嗎？', '仍要儲存'))) return;
    const chosen = f.svc.map(lookup).filter(Boolean);
    const c = ensureCustomer(name, phone, f.customerId, chosen.some(s => s.len) ? f.hl : '');
    const b = { ...(ex || {}), id: f.id || uid(), date: f.date, start: toHM(f.start), duration: +f.dur, price: +f.price || 0,
      services: chosen.map(s => svcSnap(s, f.hl)),
      customerId: c?.id || null, customerName: name || c?.name || '', phone: phone || c?.phone || '', note,
      status: ex?.status || 'booked', source: ex?.source || 'stylist', createdAt: ex?.createdAt || Date.now() };
    backend.put('bookings', b); closeSheet(); U.date = f.date; U.tab = 'day'; render(); toast(ex ? '已更新' : '預約已建立');
  }
}

function bookingInfo(x, start) {

    },
    del: async () => { if (await ask('刪除這位客人？', '刪除')) { backend.remove('customers', c.id); closeSheet(); } }
  }, sh => { $('#c-name', sh).value = c?.name || ''; $('#c-phone', sh).value = c?.phone || ''; $('#c-note', sh).value = c?.note || ''; $('#c-len', sh).value = c?.hairLen || ''; });
}
function editService(s) {
  let color = s?.color || PALETTE[S.services.length % PALETTE.length];
  openSheet(`<h1>${s ? '編輯服務' : '新增服務'}</h1>
    <label class="field"><span>名稱</span><input id="v-name" placeholder="例如：頭皮護理"></label>
    <div class="f2"><label class="field"><span>時長（分）</span><input id="v-dur" type="number" inputmode="numeric" min="5" step="5"></label><label class="field"><span>價格</span><input id="v-price" type="number" inputmode="numeric" min="0" step="10"></label></div>
    <div class="field"><span>顏色</span><div class="colors">${PALETTE.map(c => `<button data-s="color" data-c="${c}" style="--c:${c}" class="${c === color ? 'on' : ''}" aria-label="顏色"></button>`).join('')}</div></div>
    <label class="li" style="background:var(--card);border-radius:18px;margin:6px 0 8px"><span class="g"><b>依髮長加時加價</b><small>燙、染、護等頭髮越長越費時的服務</small></span><input type="checkbox" class="tog" id="v-len"></label>
    <div id="v-lens" hidden>${HAIR.slice(1).map(([k, n, h]) => `<div class="f2"><label class="field"><span>${n}（${h}）加時（分）</span><input id="v-ld-${k}" type="number" inputmode="numeric" min="0" step="5"></label><label class="field"><span>加價</span><input id="v-lp-${k}" type="number" inputmode="numeric" min="0" step="10"></label></div>`).join('')}
      <p class="note" style="margin-top:0">短髮（耳上）照原本時長、價格。</p></div>
    <label class="li" style="background:var(--card);border-radius:18px;margin:6px 0 14px"><span class="g"><b>開放預約</b></span><input type="checkbox" class="tog" id="v-active"></label>
    <button class="big" data-s="save">儲存</button>${s ? '<button class="btn ghost red" data-s="del" style="width:100%;margin-top:8px">刪除</button>' : ''}`, {
    color: t => { color = t.dataset.c; document.querySelectorAll('.colors button').forEach(b => b.classList.toggle('on', b === t)); },
    save: () => {
      const name = $('#v-name').value.trim(), duration = +$('#v-dur').value;
      if (!name) return toast('請輸入名稱'); if (!(duration > 0)) return toast('請輸入時長');
      const len = $('#v-len').checked ? Object.fromEntries(HAIR.slice(1).map(([k]) => [k, { d: Math.max(0, Math.round(+$('#v-ld-' + k).value || 0)), p: Math.max(0, +$('#v-lp-' + k).value || 0) }])) : null;
      backend.put('services', { ...(s || { id: uid(), order: Math.max(-1, ...S.services.map(x => x.order ?? 0)) + 1 }), name, duration, price: +$('#v-price').value || 0, color, active: $('#v-active').checked, len });
      closeSheet(); toast('已儲存');
    },
    del: async () => { if (await ask(`刪除「${s.name}」？過去紀錄不受影響。`, '刪除')) { backend.remove('services', s.id); closeSheet(); } }
  }, sh => { $('#v-name', sh).value = s?.name || ''; $('#v-dur', sh).value = s?.duration || 60; $('#v-price', sh).value = s?.price ?? ''; $('#v-active', sh).checked = s ? s.active !== false : true;
    const len = s?.len || LEN_DEFAULT;
    HAIR.slice(1).forEach(([k]) => { $('#v-ld-' + k, sh).value = len[k]?.d ?? 0; $('#v-lp-' + k, sh).value = len[k]?.p ?? 0; });
    const box = $('#v-lens', sh), tog = $('#v-len', sh);
    tog.checked = !!s?.len; box.hidden = !tog.checked; tog.onchange = () => { box.hidden = !tog.checked; };
  });
}

/* ---------- 事件 ---------- */
const ACT = {
  day: t => { U.date = addDays(U.date, +t.dataset.n); render(); },
  today: () => { U.date = today(); U.mini = null; render(); },
  gohome: () => { U.tab = 'day'; U.date = today(); render(); },
  ended: () => { U.showEnded = !U.showEnded; render(); },
  unlock: () => { unlockAudio(); chime(); toast('提醒聲音已開啟'); },
  new: t => openForm({ date: t.dataset.d || U.date, start: t.dataset.start ? +t.dataset.start : null }),
  nav: t => { const v = t.dataset.v; if (v === 'cal') U.tab = 'day'; else { U.tab = 'more'; U.more = v; } window.scrollTo(0, 0); render(); },
  cal: t => { U.date = addDays(U.date, +t.dataset.n * (CAL_STEP[U.cal] || 1)); U.mini = null; render(); },
  calv: t => { U.cal = t.dataset.v; lsSet(LS_CAL, U.cal); render(); },
  goday: t => { U.date = t.dataset.d; U.cal = 'day'; lsSet(LS_CAL, U.cal); render(); },
  goto: t => { U.date = t.dataset.d; U.mini = null; U.tab = 'day'; render(); },
  mini: t => { const [y, m] = (U.mini || U.date.slice(0, 7)).split('-').map(Number); const d = new Date(y, m - 1 + +t.dataset.n, 1); U.mini = d.getFullYear() + '-' + pad(d.getMonth() + 1); render(); },
  calnew: (t, e) => {
    const d = t.dataset.d; if (d < today()) return toast('過去的日期不能新增預約');
    const step = S.settings.slotStep || 30, y = e.clientY - t.getBoundingClientRect().top;
    openForm({ date: d, start: +t.dataset.lo + Math.floor(y / CAL_PX / step) * step });
  },
  device: () => deviceSetup(),
  bk: t => openBooking(t.dataset.id),
  done: t => { const b = S.bookings.find(x => x.id === t.dataset.id); if (b) { backend.put('bookings', { ...b, status: 'done', doneAt: Date.now() }); toast('已完成 ' + money(b.price)); } },
  shift: t => { const b = S.bookings.find(x => x.id === t.dataset.id); if (b) shiftUI(b); },
  req: t => openRequest(t.dataset.id),
  reqs: openRequests,
  seg: t => { U.more = t.dataset.v; render(); },
  cust: t => openCustomer(t.dataset.id),
  newcust: () => editCustomer(null),
  mon: t => { const [y, m] = U.month.split('-').map(Number); const d = new Date(y, m - 1 + +t.dataset.n, 1); U.month = d.getFullYear() + '-' + pad(d.getMonth() + 1); render(); },
  svc: t => editService(S.services.find(s => s.id === t.dataset.id)),
  holadd: () => { const v = $('#hol-in').value; if (!v) return toast('請先選日期'); const h = new Set(S.settings.holidays || []); h.add(v); backend.saveSettings({ ...S.settings, holidays: [...h].filter(x => x >= today()).sort() }); toast('已加入公休'); },
  holdel: t => backend.saveSettings({ ...S.settings, holidays: (S.settings.holidays || []).filter(x => x !== t.dataset.d) }),
  testsound: () => { unlockAudio(); chime(); toast('正在播放提醒聲…（沒聽到請把音量調大）'); },
  notifyperm: async () => { try { await Notification.requestPermission(); } catch {} render(); },
  copylink: () => { const l = bookLink(); navigator.clipboard?.writeText(l).then(() => toast('已複製連結'), () => prompt('複製這個連結', l)); },
  sharelink: async () => { const l = bookLink(); try { if (navigator.share) await navigator.share({ title: S.settings.shopName + '｜線上預約', text: '線上預約這裡點 ↓', url: l }); else { await navigator.clipboard.writeText(l); toast('已複製連結'); } } catch {} },
  rules: () => showRulesHelp(false),
  cloudsetup: () => cloudSetup(),
  testnotify: async () => {
    const url = (S.settings.notifyUrl || '').trim().replace(/\/+$/, '');
    if (!/^https:\/\//.test(url)) return toast('請先填入 https:// 開頭的網址');
    toast('測試中…');
    const label = { settings: '設定', owner: '設計師身分', database: '讀取預約資料', line: 'LINE', email: 'Email' };
    const show = (ok, rows) => openSheet(`<h1>${ok ? '設定完成' : '還有地方要修正'}</h1>
      <dl class="kv">${rows.map(([k, v]) => `<div><dt>${esc(label[k] || k)}</dt><dd style="color:${v === 'ok' ? 'var(--ink)' : v === 'skipped' ? 'var(--muted)' : 'var(--red)'}">${v === 'ok' ? '✓ 正常' : v === 'skipped' ? '未設定（選用）' : esc(v)}</dd></div>`).join('')}</dl>
      <p class="note">${ok ? '手機 LINE 應該已經收到一則測試訊息。' : '依照紅字修正 Cloudflare 的設定後再按一次測試。'}</p>
      <button class="btn" data-s="close" style="width:100%">關閉</button>`, { close: closeSheet });
    try {
      const r = await fetch(url + '/test', { method: 'POST', headers: { Authorization: 'Bearer ' + await backend.idToken() } });
      const d = await r.json();
      show(!!d.ok, Object.entries(d.checks || { error: d.error || ('HTTP ' + r.status) }));
    } catch (e) { show(false, [['連線', '連不到通知服務，請確認網址是否正確']]); }
  },
  cloudoff: async () => { if (await ask('改回單機版？雲端資料不會被刪除，之後可以再切回來。')) { localStorage.removeItem(LS_FB); location.reload(); } },
  export: async () => {
    let bookings = S.bookings;
    if (backend.allBookings) { try { toast('整理中…'); bookings = await backend.allBookings(); } catch { toast('只匯出近一年的資料'); } }
    const data = JSON.stringify({ app: 'salon', version: 2, exportedAt: new Date().toISOString(), settings: S.settings, services: S.services, customers: S.customers, bookings }, null, 1);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = `預約備份-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  },
  import: () => $('#import-file').click(),
  logout: async () => { if (await ask('確定登出？', '登出')) backend.logout(); }
};
const CHG = {
  jump: t => { if (t.value) { U.date = t.value; U.mini = null; render(); } },
  layout: t => { lsSet(LS_LAYOUT, t.value); window.scrollTo(0, 0); render(); },
  text: t => backend.saveSettings({ ...S.settings, [t.dataset.k]: t.value.trim() || (t.dataset.k === 'shopName' ? '我的髮型工作室' : '') }),
  num: t => backend.saveSettings({ ...S.settings, [t.dataset.k]: +t.value }),
  flag: t => { backend.saveSettings({ ...S.settings, [t.dataset.k]: t.checked }); if (t.dataset.k === 'keepAwake') { if (t.checked) keepAwake(); else { wake?.release?.(); wake = null; } } },
  hours: t => { const hours = clean(S.settings.hours), d = t.dataset.d; hours[d] ||= { open: false, start: '10:00', end: '20:00' };
    hours[d][t.dataset.k] = t.dataset.k === 'open' ? t.checked : t.value;
    if (toMin(hours[d].end) <= toMin(hours[d].start)) { toast('結束需晚於開始'); render(); return; }
    backend.saveSettings({ ...S.settings, hours }); }
};
$('#app').addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e); });
$('#app').addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); });
$('#app').addEventListener('input', e => { if (e.target.dataset.inp === 'q') { U.q = e.target.value; renderCustList(); } });
/* 服務項目：按住 ≡ 拖曳排序 */
$('#app').addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if (!h) return;
  e.preventDefault();
  const row = h.closest('.svc-row'), rows = [...row.parentElement.querySelectorAll('.svc-row')];
  const rects = rows.map(r => r.getBoundingClientRect()), idx = rows.indexOf(row), H = rects[idx].height, y0 = e.clientY;
  let to = idx;
  row.classList.add('dragging');
  try { h.setPointerCapture(e.pointerId); } catch {}
  try { navigator.vibrate?.(15); } catch {}
  const move = ev => {
    const dy = Math.max(rects[0].top - rects[idx].top, Math.min(rects[rects.length - 1].top - rects[idx].top, ev.clientY - y0));
    row.style.transform = `translateY(${dy}px)`;
    const cy = rects[idx].top + H / 2 + dy;
    to = rects.reduce((n, r, i) => n + (i !== idx && r.top + r.height / 2 < cy ? 1 : 0), 0);
    rows.forEach((r, i) => {
      if (i === idx) return;
      const shift = idx < to && i > idx && i <= to ? -H : idx > to && i >= to && i < idx ? H : 0;
      r.style.transition = 'transform .15s'; r.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  };
  const up = () => {
    h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
    rows.forEach(r => { r.style.transform = ''; r.style.transition = ''; }); row.classList.remove('dragging');
    if (to !== idx) {
      const list = services(); const [m] = list.splice(idx, 1); list.splice(to, 0, m);
      list.forEach((sv, k) => { if (sv.order !== k) backend.put('services', { ...sv, order: k }); });
      toast('順序已更新');
    }
  };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});
$('#tabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) { U.tab = t.dataset.tab; if (U.tab === 'day') U.date = today(); window.scrollTo(0, 0); render(); } });
$('#plus').onclick = () => openForm({ date: U.tab === 'day' ? U.date : today() });
$('#import-file').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'salon' || !d.settings) throw new Error('格式不符');
    if (!(await ask(`匯入 ${d.bookings?.length || 0} 筆預約、${d.customers?.length || 0} 位客人？${backend.mode === 'local' ? '目前資料會被取代。' : ''}`, '匯入'))) return;
    await backend.replaceAll(d); toast('匯入完成');
  } catch (err) { toast('匯入失敗：' + err.message); }
};
/* 鍵盤快捷鍵（電腦） */
document.addEventListener('keydown', e => {
  if (!S.settings || e.metaKey || e.ctrlKey || e.altKey || e.target.matches?.('input,select,textarea') || $('#confirm-root').classList.contains('open')) return;
  if (e.key === 'Escape') { if (sheetOpen()) closeSheet(); return; }
  if (!isDesk() || sheetOpen() || alertFor) return;
  const k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); openForm({ date: U.date }); return; }
  if (U.tab !== 'day') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); ACT.cal({ dataset: { n: e.key === 'ArrowLeft' ? -1 : 1 } }); }
  else if (k === 't') ACT.today();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); tick(); } });

/* ---------- 啟動 ---------- */
(async () => {
  try { backend = FIREBASE_CONFIG ? await cloudBackend() : localBackend(); await backend.start(); tick(); }
  catch (e) {
    $('#app').innerHTML = `<div class="empty">載入失敗：${esc(e.message)}<br><br>${CFG_SRC === 'local' ? '<button class="btn" id="fb-off" style="margin:auto">改回單機版</button>' : '請確認網路後重新整理'}</div>`;
    const o = $('#fb-off'); if (o) o.onclick = () => { localStorage.removeItem(LS_FB); location.reload(); };
  }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
